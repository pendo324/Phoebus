name: Build container image

on:
  push:
    branches: [main]
    paths:
      - docker/build.Dockerfile
      - .dockerignore
      - scripts/ci/setup-linux.sh
      - scripts/ci/build-libimobiledevice.sh
      - scripts/install-xtool.sh
      - scripts/xtool-env.sh
      - scripts/lgrender/go.mod
      - .github/workflows/build-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/build.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/phoebus-builder:latest
            ghcr.io/${{ github.repository_owner }}/phoebus-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without attestations an unchanged image keeps its digest.
          provenance: false
          sbom: false
