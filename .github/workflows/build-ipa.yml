name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Pushes to main build only when they change something that ends up in
    # the app or in how it is built; tags always build (path filters do
    # not apply to tags). A commit that changes only docs, tests or other
    # scripts produces no nightly.
    paths:
      - Sources/**
      - Config/**
      - Icons/**
      - SafariExtension/Resources/**
      - Package.swift
      - Package.resolved
      - xtool.yml
      - scripts/add-appintents-metadata.sh
      - scripts/appintents-metadata.py
      - scripts/build-app.sh
      - scripts/check-app.py
      - scripts/generate-icons.sh
      - scripts/ipa-name.sh
      - scripts/lgrender/**
      - scripts/merge-apps.py
      - scripts/package-ipa.sh
      - scripts/stamp-version.py
      - scripts/version.sh
      - scripts/ci/publish-release.sh
      - scripts/xtool-env.sh
      - scripts/ci/install-sdk.sh
      - scripts/ci/publish-nightly.sh
      - scripts/ci/restore-mtimes.sh
      - .github/workflows/build-ipa.yml
  workflow_dispatch: {}
  # A maintainer's /build comment on a pull request (pr-commands.yml).
  # Its caches are saved under a "pr-" prefix that builds of main and tags
  # never restore, and it never publishes.
  workflow_call:
    inputs:
      ref:
        description: The pull request commit to build
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  resolve-image:
    # Resolves the digest phoebus-builder:latest points at, so the build
    # uses one exact image even if a new one is published mid-run.
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: digest
        run: |
          image="ghcr.io/${{ github.repository_owner }}/phoebus-builder:latest"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # One job per variant, in parallel; each keeps its own build cache.
  build:
    needs: resolve-image
    strategy:
      matrix:
        variant: [device, simulator-x86_64, simulator-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/phoebus-builder@${{ needs.resolve-image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      # In a container job HOME is /github/home, but SwiftPM and xtool use
      # the user's home directory from the password database unless these
      # are set. The cached paths below depend on them.
      XDG_CONFIG_HOME: /github/home/.config
      XDG_CACHE_HOME: /github/home/.cache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          # restore-mtimes.sh reads every file's last commit.
          fetch-depth: 0

      - name: Prepare
        id: pins
        run: |
          # The workspace and restored caches belong to another user than the
          # container's root; git (and SwiftPM's clones) refuse those otherwise.
          git config --global --add safe.directory '*'
          scripts/ci/restore-mtimes.sh
          source scripts/xtool-env.sh
          echo "xtool=$XTOOL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "sdk=$(sed -n 's/^DARWIN_SDK_SHA256=//p' scripts/ci/install-sdk.sh)" >> "$GITHUB_OUTPUT"
          echo "apollo-ipa=$(sed -n 's/^DEFAULT_IPA_SHA256="\(.*\)"/\1/p' scripts/generate-icons.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Darwin SDK
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: /github/home/.config/swiftpm/swift-sdks/darwin.artifactbundle
          key: ${{ inputs.ref && 'pr-' || '' }}darwin-sdk-${{ steps.pins.outputs.sdk }}
          restore-keys: darwin-sdk-${{ steps.pins.outputs.sdk }}

      # The SDK is in private storage that the job's own token cannot read;
      # PhoebusBot's installation can.
      - name: Token for the SDK download
        id: sdk-token
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PHOEBUSBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHOEBUSBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Install Darwin SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: scripts/ci/install-sdk.sh
        env:
          DARWIN_SDK_URL: ${{ secrets.DARWIN_SDK_URL }}
          XCODE_XIP_URL: ${{ secrets.XCODE_XIP_URL }}
          DOWNLOAD_AUTH_HEADER: "Authorization: Bearer ${{ steps.sdk-token.outputs.token }}"

      - name: Cache Apollo IPA
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/phoebus/apollobase.ipa
          key: ${{ inputs.ref && 'pr-' || '' }}apollo-ipa-${{ steps.pins.outputs.apollo-ipa }}
          restore-keys: apollo-ipa-${{ steps.pins.outputs.apollo-ipa }}

      # The rendered icons, so they are not rendered again (and do not
      # change the resources) when their sources did not change.
      - name: Cache the icons
        uses: actions/cache@v5
        with:
          path: |
            Icons/LiquidGlass/*/*/*.png
            Icons/LiquidGlass/*/*/.rendered
            Icons/Standard/*/
            Icons/Standard/.extracted
            Sources/PhoebusUI/Resources/LiquidGlassIcons/*.png
          key: ${{ inputs.ref && 'pr-' || '' }}icons-${{ steps.pins.outputs.apollo-ipa }}-${{ hashFiles('Icons/LiquidGlass/**/*.json', 'Icons/LiquidGlass/**/*.svg', 'scripts/lgrender/**') }}
          restore-keys: icons-${{ steps.pins.outputs.apollo-ipa }}-${{ hashFiles('Icons/LiquidGlass/**/*.json', 'Icons/LiquidGlass/**/*.svg', 'scripts/lgrender/**') }}

      # Keyed on what invalidates a build; a new commit restores the
      # newest build of the same inputs and compiles only what changed.
      - name: Cache the build
        uses: actions/cache@v5
        with:
          path: |
            .build
            /github/home/.cache/org.swift.swiftpm
          key: ${{ inputs.ref && 'pr-' || '' }}build-${{ matrix.variant }}-${{ steps.pins.outputs.xtool }}-${{ hashFiles('docker/build.Dockerfile', 'scripts/ci/setup-linux.sh', 'Package.resolved') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            build-${{ matrix.variant }}-${{ steps.pins.outputs.xtool }}-${{ hashFiles('docker/build.Dockerfile', 'scripts/ci/setup-linux.sh', 'Package.resolved') }}-

      - name: Build
        run: |
          scripts/generate-icons.sh
          scripts/build-app.sh ${{ matrix.variant }} out/Phoebus.app
          # A tar keeps the executable bits, which artifacts do not.
          tar -C out -cf ${{ matrix.variant }}.tar Phoebus.app

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.variant }}.tar
          archive: false
          retention-days: 1
          if-no-files-found: error

  # Stamps the build number, merges the simulator builds and packages the
  # IPAs. Each IPA is uploaded as the file itself, so the artifact is
  # named after it.
  package:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      ipa: ${{ steps.package.outputs.ipa }}
      simulator: ${{ steps.package.outputs.simulator }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          # version.sh and ipa-name.sh read the release tags.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: "*.tar"
          path: apps
          merge-multiple: true

      - name: Package
        id: package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          name=$(scripts/ipa-name.sh)
          version=$(scripts/version.sh)
          for variant in device simulator-x86_64 simulator-arm64; do
            mkdir -p "apps/$variant" && tar -C "apps/$variant" -xf "apps/$variant.tar"
          done
          scripts/merge-apps.py apps/simulator.app apps/simulator-x86_64/Phoebus.app apps/simulator-arm64/Phoebus.app
          for app in apps/device/Phoebus.app apps/simulator.app; do
            scripts/stamp-version.py "$app" "$version" "$BUILD_NUMBER"
          done
          scripts/package-ipa.sh apps/device/Phoebus.app "dist/$name.ipa"
          scripts/package-ipa.sh apps/simulator.app "dist/$name-simulator.ipa"
          echo "ipa=$name.ipa" >> "$GITHUB_OUTPUT"
          echo "simulator=$name-simulator.ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.package.outputs.ipa }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.package.outputs.simulator }}
          archive: false
          if-no-files-found: error

  # Builds of main go to the rolling "nightly" pre-release.
  nightly:
    if: github.ref == 'refs/heads/main' && !inputs.ref
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: Phoebus-*.ipa
          path: dist
          merge-multiple: true

      - name: Update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-nightly.sh dist/${{ needs.package.outputs.ipa }} dist/${{ needs.package.outputs.simulator }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.ref
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # publish-release.sh finds the previous release tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: Phoebus-*.ipa
          path: dist
          merge-multiple: true

      # semantic-release (release.yml) has usually created the release, with
      # its notes, by now; this attaches the IPAs.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-release.sh "$GITHUB_REF_NAME" dist/*.ipa
