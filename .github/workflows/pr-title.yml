name: PR title

# Pull request titles must be Conventional Commits: they become the commit
# subject when a pull request is squashed, and semantic-release picks the
# next version from those. pull_request_target, so it runs for forks too;
# it never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
