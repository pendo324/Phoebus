version: 1
bundleID: com.pendo324.Phoebus
product: Phoebus
entitlementsPath: Config/Phoebus/Phoebus.entitlements
infoPath: Config/Phoebus/Info.plist
resources:
  # The compiled app icons (scripts/compile-app-icons.sh); xtool copies them
  # to the app's root, where iOS looks for them.
  - Icons/Catalog/Assets.car
  - Icons/Catalog/LGIcon-phoebus60x60@2x.png
  - Icons/Catalog/LGIcon-phoebus76x76@2x~ipad.png
extensions:
  - product: PhoebusWidget
    infoPath: Config/PhoebusWidget/Info.plist
    entitlementsPath: Config/PhoebusWidget/PhoebusWidget.entitlements
  - product: PhoebusOpenIn
    infoPath: Config/PhoebusOpenIn/Info.plist
  - product: PhoebusSafari
    infoPath: Config/PhoebusSafari/Info.plist
    resources:
      - SafariExtension/Resources/manifest.json
      - SafariExtension/Resources/link-utils.js
      - SafariExtension/Resources/content.js
      - SafariExtension/Resources/content.css
      - SafariExtension/Resources/popup.html
      - SafariExtension/Resources/popup.js
